name: "Sharp AC Gateway"
version: "0.3.17"
slug: "sharp_ac_gateway"
image: "ghcr.io/dasserbasyouni-labs/sharp-ac-gateway"
description: "Local Sharp AC control through Home Assistant MQTT discovery"
arch:
  - amd64
homeassistant: "2026.7.3"
startup: application
boot: manual
stage: experimental
init: false
apparmor: true
host_network: false
host_ipc: false
host_dbus: false
host_pid: false
host_uts: false
hassio_api: false
homeassistant_api: false
docker_api: false
auth_api: false
full_access: false
ingress: false
audio: false
video: false
gpio: false
usb: false
uart: false
udev: false
devicetree: false
kernel_modules: false
stdin: false
realtime: false
journald: false
tmpfs: true
backup: cold
services:
  - mqtt:need
map:
  - type: share
    read_only: false
options: {"control_enabled":false,"device_endpoints":[],"eco_correlation_capture":"off","eco_correlation_device_index":1,"cooling_comparison_device_index":0,"native_superjet_probe_sha256":"","custom_superjet_sha256":"","profile":"production_physical"}
schema: {"control_enabled":"bool","device_endpoints":["str"],"eco_correlation_capture":"match(^(off|baseline|compare|analyze)$)","eco_correlation_device_index":"int(1,16)","cooling_comparison_device_index":"int(0,16)","native_superjet_probe_sha256":"match(^([0-9a-f]{64})?$)","custom_superjet_sha256":"match(^([0-9a-f]{64})?$)","profile":"match(^production_physical$)"}
